name: Publish validated Windows release
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful Windows build run ID
        required: true
      source_sha:
        description: Full commit SHA built by that run
        required: true
      tag:
        description: Existing draft release tag
        required: true
permissions:
  contents: write
  actions: read
jobs:
  publish:
    env:
      BUILD_RUN: ${{ inputs.run_id }}
      SOURCE_SHA: ${{ inputs.source_sha }}
      RELEASE_TAG: ${{ inputs.tag }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify source build
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh run view "$BUILD_RUN" --json conclusion,headSha > /tmp/build.json
          python3 - <<'PY'
          import json, os
          data=json.load(open('/tmp/build.json'))
          assert data['conclusion']=='success', data
          assert data['headSha']==os.environ['SOURCE_SHA'], data
          PY
      - uses: actions/download-artifact@v4
        with:
          name: windows-setup
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
          path: assets
      - name: Verify checksums and publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cd assets
          sha256sum -c SHA256SUMS.txt
          gh release upload "$RELEASE_TAG" ZEN_Surface_Tilt_Setup_*.exe ZEN_Surface_Tilt_Portable_*.zip SHA256SUMS.txt --clobber
          gh release upload "$RELEASE_TAG" ../security-release-v2.7/V2.7-security-report.md ../security-release-v2.7/V2.7-security-reports.zip ../security-release-v2.7/V2.7-Windows-UI-Screenshots.zip --clobber
          gh release edit "$RELEASE_TAG" --draft=false --prerelease
