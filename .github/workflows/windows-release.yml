name: Windows setup release
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - uses: actions/checkout@v4
        with:
          repository: zeiss-microscopy/OAD
          ref: 781ce14954946366524b96347e7767cefb11a2c8
          path: official-oad
          sparse-checkout: ZEN-API/protofiles/proto_2026.11.1
      - name: Prepare standalone payload
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $payload = Join-Path $env:RUNNER_TEMP 'zen-payload'
          New-Item -ItemType Directory -Force $payload | Out-Null
          git -c core.quotePath=false ls-files | ForEach-Object {
            if ($_ -notlike '.github/*' -and $_ -notlike '*.png') {
              $target = Join-Path $payload $_
              New-Item -ItemType Directory -Force (Split-Path $target) | Out-Null
              Copy-Item -LiteralPath $_ -Destination $target
            }
          }
          $prefix = python -c "import sys; print(sys.prefix)"
          Copy-Item -Recurse -LiteralPath $prefix -Destination (Join-Path $payload 'runtime')
          $python = Join-Path $payload 'runtime/python.exe'
          & $python -m pip install -r requirements-gateway.txt
          if ($LASTEXITCODE) { throw 'Dependency installation failed' }
          & $python -B generate_gateway_stubs.py official-oad/ZEN-API/protofiles/proto_2026.11.1 --output "$payload/runtime/Lib/site-packages"
          if ($LASTEXITCODE) { throw 'Stub generation failed' }
          & $python -m pip freeze | Out-File -Encoding utf8 "$payload/dependencies.txt"
          & $python -B trim_runtime.py "$payload/runtime"
          if ($LASTEXITCODE) { throw 'Runtime trimming failed' }
          'ZEISS proto source: zeiss-microscopy/OAD @ 781ce14954946366524b96347e7767cefb11a2c8' | Out-File -Encoding utf8 "$payload/proto-source.txt"
          Copy-Item -Recurse official-oad/ZEN-API/protofiles/proto_2026.11.1 "$payload/api-definitions"
          "PAYLOAD=$payload" >> $env:GITHUB_ENV
      - name: Portable runtime check
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location $env:PAYLOAD
          cmd /c 'check_windows.bat --no-pause'
          if ($LASTEXITCODE) { throw 'Portable runtime check failed' }
      - name: Core and wire tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location $env:PAYLOAD
          & ./runtime/python.exe -I -B -c "import sys,unittest; sys.path.insert(0,'.'); suite=unittest.defaultTestLoader.loadTestsFromNames(['test_zen_workflow', 'test_zen_fit', 'test_zen_marks', 'test_zen_no_xy', 'test_zen_mark_gateway', 'test_zen_preferences', 'test_zen_hardware_library', 'test_zen_hardware_controls', 'test_zen_sequence','test_zen_audit','test_zen_recipe_store','test_zen_recipe_execution','test_zen_program','test_zen_stack_gateway','test_zen_completion']); result=unittest.TextTestRunner(verbosity=2).run(suite); sys.exit(not result.wasSuccessful() or result.testsRun != 125 or bool(result.skipped))"
          if ($LASTEXITCODE) { throw 'Core and wire tests failed' }
      - name: GUI regression tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location $env:PAYLOAD
          & ./runtime/python.exe -I -B -c "import sys,unittest; sys.path.insert(0,'.'); suite=unittest.defaultTestLoader.loadTestsFromNames(['test_zen_path_editor', 'test_zen_mark_gui', 'test_zen_hardware_gui']); result=unittest.TextTestRunner(verbosity=2).run(suite); sys.exit(not result.wasSuccessful() or result.testsRun != 15 or bool(result.skipped))"
          if ($LASTEXITCODE) { throw 'Regression tests failed' }
      - name: Qt offscreen smoke tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location $env:PAYLOAD
          $env:QT_QPA_PLATFORM = 'offscreen'
          $env:QT_DEBUG_PLUGINS = '1'
          $env:QT_FORCE_STDERR_LOGGING = '1'
          @'
          import sys, unittest
          sys.path.insert(0, '.')
          suite = unittest.defaultTestLoader.loadTestsFromNames(['test_zen_qt_smoke', 'test_zen_qt_regressions', 'test_zen_qt_sequence','test_zen_qt_recipes','test_zen_qt_manual','test_zen_qt_program','test_zen_qt_hotfix'])
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          sys.exit(not result.wasSuccessful() or result.testsRun != 49 or bool(result.skipped))
          '@ | Set-Content -Encoding utf8 qt-smoke-runner.py
          $proc = Start-Process -FilePath ./runtime/python.exe -ArgumentList '-u','-I','-B','qt-smoke-runner.py' -NoNewWindow -PassThru -RedirectStandardOutput qt-smoke.out.txt -RedirectStandardError qt-smoke.err.txt
          if (-not $proc.WaitForExit(300000)) {
              Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
              Get-Content qt-smoke.out.txt, qt-smoke.err.txt -ErrorAction SilentlyContinue
              throw 'Qt offscreen smoke tests timed out after 300s (platform dialog may be blocking)'
          }
          Get-Content qt-smoke.out.txt, qt-smoke.err.txt -ErrorAction SilentlyContinue
          Remove-Item qt-smoke-runner.py, qt-smoke.out.txt, qt-smoke.err.txt -ErrorAction SilentlyContinue
          if ($proc.ExitCode) { throw 'Qt offscreen smoke tests failed' }
      - name: Capture Windows workbench at three scale factors
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location $env:PAYLOAD
          $env:QT_QPA_PLATFORM = 'offscreen'
          $env:PYTHONWARNINGS = 'ignore'
          $env:PYTHONPATH = $env:PAYLOAD
          $fontDir = Join-Path $env:RUNNER_TEMP 'zen-capture-font'
          New-Item -ItemType Directory -Force $fontDir | Out-Null
          $font = Join-Path $fontDir 'NotoSansCJKsc-Regular.otf'
          Invoke-WebRequest -Uri 'https://raw.githubusercontent.com/notofonts/noto-cjk/f8d157532fbfaeda587e826d4cd5b21a49186f7c/Sans/OTF/SimplifiedChinese/NotoSansCJKsc-Regular.otf' -OutFile $font
          if ((Get-FileHash $font -Algorithm SHA256).Hash -ne '2c76254f6fc379fddfce0a7e84fb5385bb135d3e399294f6eeb6680d0365b74b') { throw 'Capture font checksum mismatch' }
          $env:ZEN_CAPTURE_FONT = $font
          $env:QT_QPA_FONTDIR = $fontDir
          foreach ($scale in @('1', '1.25', '1.5')) {
              $env:QT_SCALE_FACTOR = $scale
              $env:ZEN_CAPTURE_DIR = Join-Path $env:RUNNER_TEMP "zen-windows-ui/$scale/screenshots"
              & ./runtime/python.exe -B docs/lsm-v2.8/capture.py
              if ($LASTEXITCODE) { throw "Workbench capture failed at scale $scale" }
          }
          Remove-Item Env:QT_SCALE_FACTOR, Env:ZEN_CAPTURE_DIR, Env:ZEN_CAPTURE_FONT, Env:QT_QPA_FONTDIR -ErrorAction SilentlyContinue
      - uses: actions/upload-artifact@v4
        with:
          name: windows-ui-preview
          path: ${{ runner.temp }}/zen-windows-ui
      - name: Tk GUI smoke test
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location $env:PAYLOAD
          @'
          import sys, tempfile, time, tkinter as tk
          from pathlib import Path
          sys.path.insert(0, '.')
          from zen_gui import Workbench
          with tempfile.TemporaryDirectory() as folder:
              root = tk.Tk()
              app = Workbench(root, Path(folder))
              app.launch(None)
              deadline = time.monotonic() + 30
              while time.monotonic() < deadline:
                  root.update()
                  if (app.workflow and not app.pending and not app.workflow.busy
                          and app.workflow.state == '完成' and len(app.table.get_children()) == 4
                          and app.kpi[0].get() != '—'):
                      break
                  time.sleep(.02)
              assert app.workflow.state == '完成', app.workflow.state
              assert app.workflow.result is not None
              assert len(app.table.get_children()) == 4
              root.destroy()
          print('PASS: bundled GUI four-point demo')
          '@ | Set-Content -Encoding utf8 gui-smoke.py
          & ./runtime/python.exe -I -B gui-smoke.py
          if ($LASTEXITCODE) { throw 'GUI smoke test failed' }
          Remove-Item gui-smoke.py
      - name: Build and test installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $iscc = 'C:/Program Files (x86)/Inno Setup 6/ISCC.exe'
          if (!(Test-Path $iscc)) { throw 'Inno Setup compiler not available' }
          New-Item -ItemType Directory -Force release | Out-Null
          & $iscc "/DPayload=$env:PAYLOAD" "/O$pwd/release" ZEN_Surface_Tilt.iss
          if ($LASTEXITCODE) { throw 'Installer compilation failed' }
          $install = Join-Path $env:RUNNER_TEMP 'zen-installed'
          $process = Start-Process -FilePath ./release/LSM_Measurement_Setup_V2.8.1.exe -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/DIR=`"$install`"") -Wait -PassThru
          if ($process.ExitCode) { throw "Installer failed: $($process.ExitCode)" }
          Push-Location $install
          cmd /c 'check_windows.bat --no-pause'
          if ($LASTEXITCODE) { throw 'Installed runtime check failed' }
          Pop-Location
          Compress-Archive -Path "$env:PAYLOAD/*" -DestinationPath release/LSM_Measurement_Portable_V2.8.1.zip
          Get-ChildItem release -File | ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)" } | Set-Content -Encoding ascii release/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: windows-setup
          path: release/*
          if-no-files-found: error
